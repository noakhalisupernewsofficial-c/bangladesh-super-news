
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলাদেশ সুপার নিউজ | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f4f8;
  color:#222;
}
header{
  background:#087443;
  color:white;
  padding:20px;
  text-align:center;
}
header h2{margin:0}
.container{
  max-width:850px;
  margin:22px auto;
  padding:12px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}
h3{margin-top:0;color:#087443}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}
textarea{min-height:130px;resize:vertical}
button{
  background:#087443;
  color:white;
  border:0;
  padding:12px 17px;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
  margin:4px 3px 4px 0;
}
button:disabled{opacity:.6;cursor:not-allowed}
button.delete{background:#c62828}
button.edit{background:#1769aa}
button.logout{background:#555}
.hidden{display:none}
.news-item{
  border:1px solid #ddd;
  border-radius:9px;
  padding:14px;
  margin:12px 0;
}
.news-item img{
  max-width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:7px;
}
.muted{color:#666;font-size:13px}
#message{padding:10px 0;font-weight:bold}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>

<body>

<header>
  <h2>বাংলাদেশ সুপার নিউজ</h2>
  <p>Admin Panel</p>
</header>

<div class="container">

  <div id="loginSection" class="card">
    <h3>Admin Login</h3>

    <form id="loginForm">
      <label>ইমেইল</label>
      <input id="email" type="email" required
        placeholder="Admin email">

      <label>পাসওয়ার্ড</label>
      <input id="password" type="password" required
        placeholder="Password">

      <button id="loginBtn" type="submit">Login</button>
    </form>
    <div id="loginMessage"></div>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h3>Admin Dashboard</h3>
      <p id="adminEmail" class="muted"></p>
      <button id="logoutBtn" class="logout">Logout</button>
    </div>

    <div class="card">
      <h3 id="formTitle">নতুন সংবাদ প্রকাশ</h3>

      <form id="newsForm">
        <label>সংবাদের শিরোনাম</label>
        <input id="title" required
          placeholder="সংবাদের শিরোনাম লিখুন">

        <label>বিভাগ</label>
        <select id="category">
          <option value="জাতীয়">জাতীয়</option>
          <option value="রাজনীতি">রাজনীতি</option>
          <option value="নোয়াখালী">নোয়াখালী</option>
          <option value="সারাদেশ">সারাদেশ</option>
          <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
          <option value="খেলাধুলা">খেলাধুলা</option>
          <option value="বিনোদন">বিনোদন</option>
          <option value="শিক্ষা">শিক্ষা</option>
          <option value="অন্যান্য">অন্যান্য</option>
        </select>

        <label>সংবাদের বিস্তারিত</label>
        <textarea id="content" required
          placeholder="সংবাদের বিস্তারিত লিখুন"></textarea>

        <label>সংবাদের ছবি</label>
        <input id="imageFile" type="file"
          accept="image/*">

        <label>অথবা ছবির লিংক</label>
        <input id="imageUrl" type="url"
          placeholder="https://example.com/image.jpg">

        <label>
          <input id="published" type="checkbox" checked
            style="width:auto">
          সংবাদ প্রকাশ করতে চাই
        </label>

        <button id="saveBtn" type="submit">
          সংবাদ প্রকাশ করুন
        </button>

        <button id="cancelEditBtn" type="button"
          class="logout hidden">Edit বাতিল</button>
      </form>

      <div id="formMessage"></div>
    </div>

    <div class="card">
      <h3>প্রকাশিত ও সংরক্ষিত সংবাদ</h3>
      <button id="refreshBtn" type="button">Refresh</button>
      <div id="newsList">সংবাদ লোড হচ্ছে...</div>
    </div>

  </div>
</div>

<footer>বাংলাদেশ সুপার নিউজ</footer>

<script>
const SUPABASE_URL =
  'https://ousmshqqmudffvnxufhp.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_QPh6xZEXnjRB8M0B0F4fKw_HXlXLr4c';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let editingId = null;
let currentUser = null;

function showMessage(id, message, color='red'){
  $(id).textContent = message;
  $(id).style.color = color;
}

async function checkAdmin(){
  const {data:{user}, error} =
    await supabase.auth.getUser();

  if(error || !user) return null;

  const {data, error:adminError} = await supabase
    .from('admin_users')
    .select('user_id')
    .eq('user_id', user.id)
    .maybeSingle();

  if(adminError){
    throw adminError;
  }

  return data ? user : null;
}

function showLogin(){
  $('loginSection').classList.remove('hidden');
  $('dashboard').classList.add('hidden');
}

function showDashboard(user){
  currentUser = user;
  $('loginSection').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('adminEmail').textContent = user.email || '';
}

async function loadNews(){
  $('newsList').textContent = 'সংবাদ লোড হচ্ছে...';

  const {data, error} = await supabase
    .from('news')
    .select('*')
    .order('created_at', {ascending:false});

  if(error){
    $('newsList').textContent =
      'সংবাদ লোড হয়নি: ' + error.message;
    return;
  }

  $('newsList').replaceChildren();

  if(!data || data.length === 0){
    $('newsList').textContent = 'এখনো কোনো সংবাদ নেই।';
    return;
  }

  data.forEach(item=>{
    const box = document.createElement('div');
    box.className = 'news-item';

    const title = document.createElement('h3');
    title.textContent = item.title || '';

    const category = document.createElement('p');
    category.className = 'muted';
    category.textContent =
      'বিভাগ: ' + (item.category || 'অন্যান্য') +
      ' | ' + (item.published ? 'প্রকাশিত' : 'খসড়া');

    const content = document.createElement('p');
    content.textContent = (item.content || '').slice(0,220);

    box.append(title, category, content);

    if(item.image_url){
      const img = document.createElement('img');
      img.src = item.image_url;
      img.alt = item.title || 'সংবাদের ছবি';
      img.loading = 'lazy';
      box.append(img);
    }

    const editBtn = document.createElement('button');
    editBtn.className = 'edit';
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', ()=>editNews(item));

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete';
    deleteBtn.textContent = 'Delete';
    deleteBtn.addEventListener('click', ()=>deleteNews(item.id));

    box.append(editBtn, deleteBtn);
    $('newsList').append(box);
  });
}

function editNews(item){
  editingId = item.id;

  $('title').value = item.title || '';
  $('category').value = item.category || 'অন্যান্য';
  $('content').value = item.content || '';
  $('imageUrl').value = item.image_url || '';
  $('imageFile').value = '';
  $('published').checked = !!item.published;

  $('formTitle').textContent = 'সংবাদ সম্পাদনা';
  $('saveBtn').textContent = 'পরিবর্তন সংরক্ষণ';
  $('cancelEditBtn').classList.remove('hidden');

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingId = null;
  $('newsForm').reset();
  $('published').checked = true;
  $('formTitle').textContent = 'নতুন সংবাদ প্রকাশ';
  $('saveBtn').textContent = 'সংবাদ প্রকাশ করুন';
  $('cancelEditBtn').classList.add('hidden');
}

async function uploadImage(file){
  if(!file) return null;

  if(!file.type.startsWith('image/')){
    throw new Error('শুধু ছবির ফাইল নির্বাচন করুন।');
  }

  if(file.size > 5 * 1024 * 1024){
    throw new Error('ছবির সাইজ ৫ MB-এর কম হতে হবে।');
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = Date.now() + '-' + safeName;

  const {error} = await supabase.storage
    .from('news-images')
    .upload(path, file, {
      cacheControl:'3600',
      upsert:false
    });

  if(error) throw error;

  const {data} = supabase.storage
    .from('news-images')
    .getPublicUrl(path);

  return data.publicUrl;
}

$('loginForm').addEventListener('submit', async event=>{
  event.preventDefault();

  const email = $('email').value.trim();
  const password = $('password').value;

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Login হচ্ছে...';
  showMessage('loginMessage','লগইন হচ্ছে...','#087443');

  try{
    const {error} = await supabase.auth
      .signInWithPassword({email,password});

    if(error) throw error;

    const user = await checkAdmin();

    if(!user){
      await supabase.auth.signOut();
      throw new Error('এই অ্যাকাউন্ট Admin হিসেবে অনুমোদিত নয়।');
    }

    $('password').value = '';
    showDashboard(user);
    showMessage('loginMessage','');
    await loadNews();

  }catch(error){
    showMessage('loginMessage','লগইন হয়নি: ' + error.message);
  }finally{
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Login';
  }
});

$('newsForm').addEventListener('submit', async event=>{
  event.preventDefault();

  $('saveBtn').disabled = true;
  showMessage('formMessage','সংরক্ষণ হচ্ছে...','#087443');

  try{
    const title = $('title').value.trim();
    const content = $('content').value.trim();
    const category = $('category').value;
    const published = $('published').checked;

    let image_url = $('imageUrl').value.trim();
    const file = $('imageFile').files[0];

    if(file){
      image_url = await uploadImage(file);
    }

    const newsData = {
      title,
      content,
      category,
      image_url: image_url || null,
      published
    };

    let result;

    if(editingId){
      result = await supabase
        .from('news')
        .update(newsData)
        .eq('id', editingId);
    }else{
      newsData.author_id = currentUser.id;
      result = await supabase
        .from('news')
        .insert(newsData);
    }

    if(result.error) throw result.error;

    showMessage('formMessage',
      editingId ? 'সংবাদ আপডেট হয়েছে।' : 'সংবাদ প্রকাশ হয়েছে।',
      '#087443');

    resetForm();
    await loadNews();

  }catch(error){
    showMessage('formMessage','সমস্যা হয়েছে: ' + error.message);
  }finally{
    $('saveBtn').disabled = false;
  }
});

async function deleteNews(id){
  if(!confirm('আপনি কি এই সংবাদটি মুছে ফেলতে চান?')) return;

  const {error} = await supabase
    .from('news')
    .delete()
    .eq('id', id);

  if(error){
    alert('মুছতে সমস্যা হয়েছে: ' + error.message);
    return;
  }

  alert('সংবাদ মুছে ফেলা হয়েছে।');
  await loadNews();
}

$('logoutBtn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
  currentUser = null;
  showLogin();
});

$('refreshBtn').addEventListener('click', loadNews);
$('cancelEditBtn').addEventListener('click', resetForm);

async function start(){
  try{
    const {data:{session}, error} =
      await supabase.auth.getSession();

    if(error) throw error;

    if(!session){
      showLogin();
      return;
    }

    const user = await checkAdmin();

    if(user){
      showDashboard(user);
      await loadNews();
    }else{
      await supabase.auth.signOut();
      showLogin();
    }

  }catch(error){
    showLogin();
    showMessage('loginMessage',
      'সংযোগে সমস্যা: ' + error.message);
  }
}

start();
</script>

</body>
</html>
