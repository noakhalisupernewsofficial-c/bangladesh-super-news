
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল | বাংলাদেশ সুপার নিউজ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f7;color:#222;font-family:Arial,sans-serif}
header{background:#a90018;color:white;text-align:center;padding:22px 12px}
header h2{margin:0 0 8px}
header p{margin:0}
.container{max-width:950px;margin:22px auto;padding:12px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 14px #0001;margin-bottom:18px}
h3{color:#a90018;margin-top:0}
label{display:block;margin-top:14px;font-weight:bold}
input,textarea,select{width:100%;padding:12px;margin-top:7px;border:1px solid #ddd;border-radius:7px;font-size:16px}
textarea{min-height:150px;resize:vertical}
button{background:#a90018;color:white;border:0;border-radius:7px;padding:11px 15px;font-size:14px;cursor:pointer;margin:5px 3px 5px 0}
button:disabled{opacity:.5}
.secondary{background:#555}
.green{background:#16834a}
.red{background:#b00020}
.hidden{display:none!important}
.message{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.small{font-size:13px;color:#666;line-height:1.6}
.news-item{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}
.news-item h4{margin:0 0 8px}
.news-item img{width:100%;max-width:220px;max-height:140px;object-fit:cover;border-radius:7px;margin-top:8px}
.status{font-size:13px;font-weight:bold}
footer{text-align:center;color:#777;font-size:13px;padding:20px}
</style>
</head>
<body>

<header>
<h2>বাংলাদেশ সুপার নিউজ</h2>
<p>সত্যের পথে, দেশের সাথে।</p>
</header>

<main class="container">

<section class="card" id="loginBox">
<h3>🔐 অ্যাডমিন লগইন</h3>
<form id="loginForm">
<label>ইমেইল</label>
<input id="email" type="email" required autocomplete="username">
<label>পাসওয়ার্ড</label>
<input id="password" type="password" required autocomplete="current-password">
<button id="loginBtn" type="submit">লগইন করুন</button>
</form>
<p id="loginMessage" class="message"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>স্বাগতম, অ্যাডমিন!</h3>
<p id="adminEmail" class="small"></p>
<button id="logoutBtn">লগআউট</button>
</div>

<div class="card" id="editorCard">
<h3 id="editorTitle">📰 নতুন সংবাদ প্রকাশ</h3>

<form id="newsForm">
<input type="hidden" id="newsId">

<label>সংবাদের শিরোনাম</label>
<input id="title" type="text" maxlength="250" required placeholder="সংবাদের শিরোনাম লিখুন">

<label>সংবাদের বিভাগ</label>
<select id="category" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option value="জাতীয়">জাতীয়</option>
<option value="রাজনীতি">রাজনীতি</option>
<option value="সারাদেশ">সারাদেশ</option>
<option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
<option value="খেলাধুলা">খেলাধুলা</option>
<option value="প্রযুক্তি">প্রযুক্তি</option>
<option value="বিনোদন">বিনোদন</option>
<option value="শিক্ষা">শিক্ষা</option>
<option value="অর্থনীতি">অর্থনীতি</option>
<option value="অন্যান্য">অন্যান্য</option>
</select>

<label>সংবাদের বিস্তারিত</label>
<textarea id="content" required placeholder="সম্পূর্ণ সংবাদ লিখুন"></textarea>

<label>সংবাদের ছবি (ঐচ্ছিক)</label>
<input id="imageFile" type="file" accept="image/*">
<p class="small" id="imageHelp">ছবি না দিলে আগের ছবিটি অপরিবর্তিত থাকবে।</p>

<label>প্রকাশের অবস্থা</label>
<select id="published">
<option value="false">খসড়া হিসেবে সংরক্ষণ</option>
<option value="true">ওয়েবসাইটে প্রকাশ</option>
</select>

<button id="saveBtn" type="submit">সংবাদ সংরক্ষণ করুন</button>
<button type="button" class="secondary hidden" id="cancelEdit">সম্পাদনা বাতিল</button>
<p id="formMessage" class="message"></p>
</form>
</div>

<div class="card">
<h3>📋 প্রকাশিত ও সংরক্ষিত সংবাদ</h3>
<button id="refreshBtn" class="secondary">তালিকা রিফ্রেশ করুন</button>
<p id="listMessage" class="message"></p>
<div id="newsList"></div>
</div>
</section>
</main>

<footer>© <span id="year"></span> বাংলাদেশ সুপার নিউজ</footer>

<script>
const SUPABASE_URL = "https://ousmshqqmudffvnxufhp.supabase.co";
const SUPABASE_KEY = "sb_publishable_QPh6xZEXnjRB8M0B0F4fKw_HXlXLr4c";

const $ = id => document.getElementById(id);
let client = null;
let currentSession = null;
let newsCache = [];
let checking = false;

$("year").textContent = new Date().getFullYear();

function showLogin(msg=""){
  $("dashboard").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("loginMessage").textContent = msg;
}

function showDashboard(session){
  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("adminEmail").textContent = session.user.email || "";
}

async function verifyAdmin(session){
  if(!client || !session) return false;
  if(checking) return false;
  checking = true;

  try{
    const {data,error} = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id",session.user.id)
      .maybeSingle();

    if(error || !data){
      showLogin(error ? "অ্যাডমিন যাচাই করা যায়নি।" : "আপনি অনুমোদিত অ্যাডমিন নন।");
      await client.auth.signOut();
      return false;
    }

    currentSession = session;
    showDashboard(session);
    await loadNews();
    return true;
  }catch(error){
    showLogin("যাচাই সমস্যা: " + error.message);
    return false;
  }finally{
    checking = false;
  }
}

async function initialize(){
  if(!window.supabase){
    showLogin("Supabase লোড হয়নি। ইন্টারনেট পরীক্ষা করুন।");
    return;
  }

  client = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  client.auth.onAuthStateChange((event,session)=>{
    setTimeout(()=>{
      if(session) verifyAdmin(session);
      else{
        currentSession = null;
        showLogin();
      }
    },0);
  });

  const {data,error} = await client.auth.getSession();
  if(error){
    showLogin("সেশন পরীক্ষা করা যায়নি।");
    return;
  }
  if(data.session) await verifyAdmin(data.session);
  else showLogin();
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("loginBtn").disabled = true;
  $("loginMessage").textContent = "যাচাই হচ্ছে...";

  try{
    const {data,error} = await client.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });
    if(error){
      $("loginMessage").textContent = "লগইন হয়নি: " + error.message;
    }else if(data.session){
      await verifyAdmin(data.session);
    }
  }catch(error){
    $("loginMessage").textContent = "সমস্যা: " + error.message;
  }finally{
    $("loginBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click",async()=>{
  const {error} = await client.auth.signOut();
  if(error) alert("লগআউট সমস্যা: " + error.message);
  else{
    $("password").value = "";
    showLogin("সফলভাবে লগআউট হয়েছে।");
  }
});

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

async function loadNews(){
  $("listMessage").textContent = "সংবাদ তালিকা লোড হচ্ছে...";
  const {data,error} = await client
    .from("news")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    $("listMessage").textContent = "সংবাদ লোড হয়নি: " + error.message;
    return;
  }

  newsCache = data || [];
  $("listMessage").textContent = newsCache.length
    ? "মোট সংবাদ: " + newsCache.length
    : "এখনো কোনো সংবাদ নেই।";

  renderNews();
}

function renderNews(){
  const list = $("newsList");
  list.innerHTML = "";

  newsCache.forEach(item=>{
    const status = item.published
      ? '<span class="status" style="color:green">প্রকাশিত</span>'
      : '<span class="status" style="color:#b36b00">খসড়া</span>';

    const image = item.image_url
      ? '<img src="' + escapeHTML(item.image_url) + '" alt="সংবাদের ছবি">'
      : "";

    const article = document.createElement("div");
    article.className = "news-item";
    article.innerHTML = `
      <h4>${escapeHTML(item.title)}</h4>
      <p class="small">বিভাগ: ${escapeHTML(item.category || "অন্যান্য")} | ${status}</p>
      ${image}
      <p>${escapeHTML((item.content || "").slice(0,180))}${(item.content || "").length > 180 ? "..." : ""}</p>
      <button data-action="edit" data-id="${item.id}">✏️ সম্পাদনা</button>
      <button class="green" data-action="toggle" data-id="${item.id}">
        ${item.published ? "অপ্রকাশ করুন" : "প্রকাশ করুন"}
      </button>
      <button class="red" data-action="delete" data-id="${item.id}">🗑️ ডিলিট</button>
    `;
    list.appendChild(article);
  });
}

function resetForm(){
  $("newsForm").reset();
  $("newsId").value = "";
  $("editorTitle").textContent = "📰 নতুন সংবাদ প্রকাশ";
  $("saveBtn").textContent = "সংবাদ সংরক্ষণ করুন";
  $("cancelEdit").classList.add("hidden");
  $("formMessage").textContent = "";
  $("imageHelp").textContent = "ছবি না দিলে আগের ছবিটি অপরিবর্তিত থাকবে।";
}

$("cancelEdit").addEventListener("click",resetForm);

$("newsForm").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentSession){
    $("formMessage").textContent = "আপনার সেশন নেই। আবার লগইন করুন।";
    return;
  }

  const id = $("newsId").value;
  const existing = newsCache.find(n=>String(n.id) === String(id));
  const file = $("imageFile").files[0];

  $("saveBtn").disabled = true;
  $("formMessage").textContent = "সংবাদ সংরক্ষণ হচ্ছে...";

  try{
    let imageUrl = existing?.image_url || null;

    if(file){
      if(!file.type.startsWith("image/")){
        throw new Error("শুধু ছবির ফাইল নির্বাচন করুন।");
      }
      if(file.size > 5 * 1024 * 1024){
        throw new Error("ছবির আকার ৫ MB-এর বেশি হতে পারবে না।");
      }

      const extension = file.name.split(".").pop().replace(/[^a-zA-Z0-9]/g,"") || "jpg";
      const filePath = currentSession.user.id + "/" + crypto.randomUUID() + "." + extension;

      const {error:uploadError} = await client.storage
        .from("news-images")
        .upload(filePath,file,{contentType:file.type,upsert:false});

      if(uploadError) throw uploadError;

      const {data:urlData} = client.storage
        .from("news-images")
        .getPublicUrl(filePath);

      imageUrl = urlData.publicUrl;
    }

    const record = {
      title:$("title").value.trim(),
      content:$("content").value.trim(),
      category:$("category").value,
      image_url:imageUrl,
      published:$("published").value === "true"
    };

    let result;
    if(id){
      result = await client.from("news").update(record).eq("id",id);
    }else{
      record.author_id = currentSession.user.id;
      result = await client.from("news").insert(record);
    }

    if(result.error) throw result.error;

    $("formMessage").textContent = id
      ? "সংবাদ সফলভাবে আপডেট হয়েছে।"
      : "সংবাদ সফলভাবে সংরক্ষণ হয়েছে।";

    resetForm();
    await loadNews();

  }catch(error){
    $("formMessage").textContent = "সংরক্ষণ করা যায়নি: " + error.message;
  }finally{
    $("saveBtn").disabled = false;
  }
});

$("newsList").addEventListener("click",async e=>{
  const button = e.target.closest("button[data-action]");
  if(!button) return;

  const id = button.dataset.id;
  const action = button.dataset.action;
  const item = newsCache.find(n=>String(n.id) === String(id));
  if(!item) return;

  if(action === "edit"){
    $("newsId").value = item.id;
    $("title").value = item.title || "";
    $("content").value = item.content || "";
    $("category").value = item.category || "";
    $("published").value = String(!!item.published);
    $("editorTitle").textContent = "✏️ সংবাদ সম্পাদনা";
    $("saveBtn").textContent = "পরিবর্তন সংরক্ষণ করুন";
    $("cancelEdit").classList.remove("hidden");
    $("imageHelp").textContent = "নতুন ছবি না দিলে আগের ছবিই থাকবে।";
    $("formMessage").textContent = "সংবাদ সম্পাদনা করুন।";
    $("editorCard").scrollIntoView({behavior:"smooth"});
    return;
  }

  if(action === "delete"){
    if(!confirm("আপনি কি নিশ্চিতভাবে এই সংবাদটি ডিলিট করতে চান?")) return;

    button.disabled = true;
    const {error} = await client.from("news").delete().eq("id",id);
    if(error){
      alert("ডিলিট করা যায়নি: " + error.message);
      button.disabled = false;
    }else{
      alert("সংবাদ ডিলিট হয়েছে।");
      resetForm();
      await loadNews();
    }
    return;
  }

  if(action === "toggle"){
    const newStatus = !item.published;
    if(!confirm(newStatus ? "এই সংবাদটি প্রকাশ করবেন?" : "এই সংবাদটি অপ্রকাশ করবেন?")) return;

    button.disabled = true;
    const {error} = await client
      .from("news")
      .update({published:newStatus})
      .eq("id",id);

    if(error){
      alert("পরিবর্তন করা যায়নি: " + error.message);
      button.disabled = false;
    }else{
      await loadNews();
    }
  }
});

$("refreshBtn").addEventListener("click",loadNews);

initialize();
</script>
</body>
</html>
