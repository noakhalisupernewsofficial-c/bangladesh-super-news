<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | বাংলাদেশ সুপার নিউজ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
header{
  background:#075e36;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0}
.container{
  max-width:850px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
h2{margin-top:0;color:#075e36}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:16px;
}
textarea{min-height:130px}
button{
  border:0;
  padding:12px 17px;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
  color:white;
  background:#087443;
  margin:4px;
}
button:disabled{opacity:.5}
.delete{background:#dc2626}
.edit{background:#2563eb}
.logout{background:#64748b}
.hidden{display:none}
#message{margin:12px 0;font-weight:bold}
.news-item{
  border:1px solid #e2e8f0;
  border-radius:9px;
  padding:14px;
  margin:12px 0;
}
.news-item img{
  max-width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:7px;
}
.news-item h3{margin:8px 0}
.news-item p{white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>

<body>

<header>
  <h1>বাংলাদেশ সুপার নিউজ</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <div class="card" id="loginCard">
    <h2>Admin Login</h2>

    <input id="email" type="email"
      placeholder="Admin Email" autocomplete="username">

    <input id="password" type="password"
      placeholder="Password" autocomplete="current-password">

    <button id="loginBtn">Login</button>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2 id="formHeading">নতুন সংবাদ প্রকাশ</h2>

      <input id="title" placeholder="সংবাদের শিরোনাম">

      <textarea id="content"
        placeholder="সংবাদের বিস্তারিত লিখুন"></textarea>

      <select id="category">
        <option value="জাতীয়">জাতীয়</option>
        <option value="রাজনীতি">রাজনীতি</option>
        <option value="নোয়াখালী">নোয়াখালী</option>
        <option value="চট্টগ্রাম">চট্টগ্রাম</option>
        <option value="ঢাকা">ঢাকা</option>
        <option value="খেলাধুলা">খেলাধুলা</option>
        <option value="বিশ্ব">বিশ্ব</option>
        <option value="অন্যান্য">অন্যান্য</option>
      </select>

      <label>সংবাদের ছবি (JPG/JPEG)</label>
      <input id="imageFile" type="file" accept="image/jpeg">

      <label>
        <input id="published" type="checkbox" checked
          style="width:auto">
        সংবাদ প্রকাশ করুন
      </label>

      <div class="actions">
        <button id="publishBtn">সংবাদ সংরক্ষণ</button>
        <button id="cancelEditBtn" class="logout hidden">
          Edit বাতিল
        </button>
      </div>

      <div id="message"></div>
    </div>

    <div class="card">
      <h2>প্রকাশিত সংবাদ তালিকা</h2>
      <button id="refreshBtn">তালিকা Refresh</button>
      <div id="newsList">সংবাদ লোড হচ্ছে...</div>
    </div>

    <div class="card">
      <button id="logoutBtn" class="logout">Logout</button>
    </div>

  </div>
</div>

<footer>বাংলাদেশ সুপার নিউজ</footer>
  
<script>
alert('JavaScript চালু আছে; Supabase: ' + typeof window.supabase);

const SUPABASE_URL =
  'https://ousmshqqmudffvnxufhp.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_QPh6xZEXnjRB8M0B0F4fKw_HXlXLr4c';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let oldImageUrl = null;

const $ = id => document.getElementById(id);

function message(text){
  $('message').textContent = text;
}

async function getAdmin(){
  const {data,error} = await supabase.auth.getUser();

  if(error || !data.user) return null;

  const {data:admin,error:adminError} = await supabase
    .from('admin_users')
    .select('user_id')
    .eq('user_id',data.user.id)
    .maybeSingle();

  if(adminError || !admin) return null;

  return data.user;
}

function updateView(){
  supabase.auth.getSession().then(({data})=>{
    const loggedIn = !!data.session;

    $('loginCard').classList.toggle('hidden',loggedIn);
    $('dashboard').classList.toggle('hidden',!loggedIn);

    if(loggedIn) loadNews();
  });
}

async function login(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || !password){
    alert('ইমেইল ও পাসওয়ার্ড লিখুন।');
    return;
  }

  $('loginBtn').disabled = true;

  const {error} = await supabase.auth.signInWithPassword({
    email,password
  });

  $('loginBtn').disabled = false;

  if(error){
    alert('Login হয়নি: '+error.message);
    return;
  }

  const user = await getAdmin();

  if(!user){
    await supabase.auth.signOut();
    alert('এই অ্যাকাউন্ট Admin নয়।');
    return;
  }

  $('password').value = '';
  updateView();
}

function resetForm(){
  editingId = null;
  oldImageUrl = null;

  $('title').value = '';
  $('content').value = '';
  $('imageFile').value = '';
  $('published').checked = true;

  $('formHeading').textContent = 'নতুন সংবাদ প্রকাশ';
  $('publishBtn').textContent = 'সংবাদ সংরক্ষণ';
  $('cancelEditBtn').classList.add('hidden');
}

$('loginBtn').addEventListener('click',login);

$('password').addEventListener('keydown',e=>{
  if(e.key === 'Enter') login();
});

$('cancelEditBtn').addEventListener('click',resetForm);

$('refreshBtn').addEventListener('click',loadNews);

async function loadNews(){
  const user = await getAdmin();

  if(!user){
    $('newsList').textContent = 'Admin হিসেবে লগইন করুন।';
    return;
  }

  $('newsList').textContent = 'সংবাদ লোড হচ্ছে...';

  const {data,error} = await supabase
    .from('news')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    $('newsList').textContent =
      'সংবাদ লোড হয়নি: '+error.message;
    return;
  }

  $('newsList').innerHTML = '';

  if(!data || data.length === 0){
    $('newsList').textContent = 'এখনো কোনো সংবাদ নেই।';
    return;
  }

  data.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'news-item';

    const title = document.createElement('h3');
    title.textContent = item.title;
    div.appendChild(title);

    const category = document.createElement('p');
    category.textContent = 'বিভাগ: '+(item.category || 'অন্যান্য');
    div.appendChild(category);

    const status = document.createElement('p');
    status.textContent = item.published
      ? 'অবস্থা: প্রকাশিত'
      : 'অবস্থা: অপ্রকাশিত';
    div.appendChild(status);

    if(item.image_url){
      const img = document.createElement('img');
      img.src = item.image_url;
      img.alt = item.title;
      div.appendChild(img);
    }

    const content = document.createElement('p');
    content.textContent = item.content;
    div.appendChild(content);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'edit';
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click',()=>editNews(item));
    actions.appendChild(editBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete';
    deleteBtn.textContent = 'Delete';
    deleteBtn.addEventListener('click',()=>deleteNews(item));
    actions.appendChild(deleteBtn);

    div.appendChild(actions);
    $('newsList').appendChild(div);
  });
}

function editNews(item){
  editingId = item.id;
  oldImageUrl = item.image_url || null;

  $('title').value = item.title || '';
  $('content').value = item.content || '';
  $('category').value = item.category || 'জাতীয়';
  $('published').checked = !!item.published;
  $('imageFile').value = '';

  $('formHeading').textContent = 'সংবাদ Edit করুন';
  $('publishBtn').textContent = 'পরিবর্তন সংরক্ষণ';
  $('cancelEditBtn').classList.remove('hidden');

  window.scrollTo({top:0,behavior:'smooth'});
  message('সংবাদ Edit করার জন্য প্রস্তুত।');
}

$('publishBtn').addEventListener('click',async()=>{
  const user = await getAdmin();

  if(!user){
    message('Admin হিসেবে লগইন করুন।');
    return;
  }

  const title = $('title').value.trim();
  const content = $('content').value.trim();
  const category = $('category').value;
  const file = $('imageFile').files[0];
  const published = $('published').checked;
  const btn = $('publishBtn');

  if(!title || !content){
    message('শিরোনাম ও বিস্তারিত লিখুন।');
    return;
  }

  if(file && file.type !== 'image/jpeg'){
    message('শুধু JPG/JPEG ছবি ব্যবহার করুন।');
    return;
  }

  btn.disabled = true;
  message('সংবাদ সংরক্ষণ হচ্ছে...');

  try{
    let image_url = oldImageUrl;

    if(file){
      const safeName = file.name.replace(
        /[^a-zA-Z0-9._-]/g,'_'
      );

      const path = user.id + '/' + Date.now() + '-' + safeName;

      const {error:uploadError} = await supabase
        .storage
        .from('news-images')
        .upload(path,file,{
          contentType:'image/jpeg',
          upsert:false
        });

      if(uploadError) throw uploadError;

      const {data:publicData} = supabase
        .storage
        .from('news-images')
        .getPublicUrl(path);

      image_url = publicData.publicUrl;
    }

    const newsData = {
      title,
      content,
      category,
      image_url,
      published
    };

    let result;

    if(editingId){
      result = await supabase
        .from('news')
        .update(newsData)
        .eq('id',editingId);
    }else{
      result = await supabase
        .from('news')
        .insert({
          ...newsData,
          author_id:user.id
        });
    }

    if(result.error) throw result.error;

    message(editingId
      ? 'সংবাদ পরিবর্তন সফলভাবে সংরক্ষিত হয়েছে।'
      : 'সংবাদ সফলভাবে সংরক্ষিত হয়েছে।');

    resetForm();
    await loadNews();

  }catch(err){
    message('সংরক্ষণ হয়নি: '+(err.message || 'সমস্যা'));
  }finally{
    btn.disabled = false;
  }
});

async function deleteNews(item){
  const user = await getAdmin();

  if(!user){
    alert('Admin হিসেবে লগইন করুন।');
    return;
  }

  if(!confirm('এই সংবাদটি মুছে ফেলবেন?')) return;

  const {error} = await supabase
    .from('news')
    .delete()
    .eq('id',item.id);

  if(error){
    alert('Delete হয়নি: '+error.message);
    return;
  }

  alert('সংবাদ মুছে ফেলা হয়েছে।');
  await loadNews();
}

$('logoutBtn').addEventListener('click',async()=>{
  await supabase.auth.signOut();
  resetForm();
  updateView();
});

supabase.auth.onAuthStateChange(()=>{
  setTimeout(updateView,0);
});

updateView();
</script>

</body>
</html>
