
<script>
document.getElementById('today').textContent =
  new Date().toLocaleDateString('bn-BD');

document.getElementById('year').textContent =
  new Date().getFullYear();

let selected = 'সব';

function chooseCategory(cat, btn) {
  selected = cat;
  document.querySelectorAll('.categories button').forEach(b => {
    b.classList.remove('active');
  });
  btn.classList.add('active');
  filterNews();
}

function filterNews() {
  const q = document.getElementById('search').value.toLowerCase();

  document.querySelectorAll('#newsGrid .news').forEach(card => {
    const matchCat = selected === 'সব' ||
      card.dataset.category === selected;
    const matchText = card.innerText.toLowerCase().includes(q);
    card.style.display = matchCat && matchText ? '' : 'none';
  });
}

let paused = false;

function toggleTicker() {
  paused = !paused;
  document.getElementById('ticker').classList.toggle('paused', paused);
  document.getElementById('pauseBtn').textContent =
    paused ? 'চালু করুন' : 'থামান';
}

/* বাংলাদেশের ৮ বিভাগ ও ৬৪ জেলা */
const bangladeshAreas = {
  "ঢাকা":["ঢাকা","গাজীপুর","নারায়ণগঞ্জ","নরসিংদী","টাঙ্গাইল","কিশোরগঞ্জ","মানিকগঞ্জ","মুন্সিগঞ্জ","মাদারীপুর","শরীয়তপুর","গোপালগঞ্জ","ফরিদপুর","রাজবাড়ী"],
  "চট্টগ্রাম":["চট্টগ্রাম","কুমিল্লা","ফেনী","নোয়াখালী","লক্ষ্মীপুর","চাঁদপুর","ব্রাহ্মণবাড়িয়া","রাঙামাটি","বান্দরবান","খাগড়াছড়ি","কক্সবাজার"],
  "রাজশাহী":["রাজশাহী","বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ"],
  "খুলনা":["খুলনা","বাগেরহাট","সাতক্ষীরা","যশোর","নড়াইল","মাগুরা","ঝিনাইদহ","কুষ্টিয়া","চুয়াডাঙ্গা","মেহেরপুর"],
  "বরিশাল":["বরিশাল","ভোলা","পটুয়াখালী","পিরোজপুর","বরগুনা","ঝালকাঠি"],
  "সিলেট":["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"],
  "রংপুর":["রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"],
  "ময়মনসিংহ":["ময়মনসিংহ","জামালপুর","নেত্রকোণা","শেরপুর"]
};

const areaDivision = document.getElementById('areaDivision');
const areaDistrict = document.getElementById('areaDistrict');
const areaMessage = document.getElementById('areaMessage');
const divisionButtons = document.getElementById('divisionButtons');

Object.keys(bangladeshAreas).forEach(division => {
  const option = document.createElement('option');
  option.value = division;
  option.textContent = division + ' বিভাগ';
  areaDivision.appendChild(option);

  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = division;
  button.addEventListener('click', () => {
    areaDivision.value = division;
    updateDistricts();
  });
  divisionButtons.appendChild(button);
});

function updateDistricts() {
  const division = areaDivision.value;
  areaDistrict.innerHTML = '<option value="">জেলা নির্বাচন করুন</option>';

  if (!division) {
    areaDistrict.disabled = true;
    areaMessage.textContent = 'প্রথমে বিভাগ নির্বাচন করুন।';
    return;
  }

  bangladeshAreas[division].forEach(district => {
    const option = document.createElement('option');
    option.value = district;
    option.textContent = district + ' জেলা';
    areaDistrict.appendChild(option);
  });

  areaDistrict.disabled = false;
  areaMessage.textContent =
    division + ' বিভাগ নির্বাচন করা হয়েছে। এবার জেলা নির্বাচন করুন।';

  document.querySelectorAll('#divisionButtons button').forEach(button => {
    button.classList.toggle('active', button.textContent === division);
  });
}

areaDivision.addEventListener('change', updateDistricts);

areaDistrict.addEventListener('change', () => {
  if (areaDistrict.value) {
    areaMessage.textContent =
      'আপনি নির্বাচন করেছেন: ' + areaDivision.value +
      ' বিভাগ, ' + areaDistrict.value + ' জেলা।';
  }
});

/* Supabase থেকে প্রকাশিত সংবাদ দেখানো */
const SUPABASE_URL = 'https://ousmshqqmudffvnxufhp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QPh6xZEXnjRB8M0B0F4fKw_HXlXLr4c';

function loadSupabaseLibrary() {
  return new Promise((resolve, reject) => {
    if (window.supabase) {
      resolve();
      return;
    }

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    script.onload = resolve;
    script.onerror = () => reject(new Error('Supabase লাইব্রেরি লোড হয়নি'));
    document.head.appendChild(script);
  });
}

function addText(parent, tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value || '';
  if (className) element.className = className;
  parent.appendChild(element);
  return element;
}

async function loadNews() {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '<p>সংবাদ লোড হচ্ছে...</p>';

  try {
    await loadSupabaseLibrary();

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } = await client
      .from('news')
      .select('id,title,content,image_url,category,created_at')
      .eq('published', true)
      .order('created_at', { ascending: false });

    if (error) throw error;

    grid.innerHTML = '';

    if (!data || data.length === 0) {
      grid.textContent = 'এখনো কোনো প্রকাশিত সংবাদ পাওয়া যায়নি।';
      return;
    }

    data.forEach(news => {
      const card = document.createElement('article');
      card.className = 'news';
      card.dataset.category = news.category || '';

      if (news.image_url) {
        const photo = document.createElement('div');
        photo.className = 'photo';

        const img = document.createElement('img');
        img.src = news.image_url;
        img.alt = news.title || 'সংবাদের ছবি';
        img.loading = 'lazy';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';

        photo.appendChild(img);
        card.appendChild(photo);
      } else {
        addText(card, 'div', 'সংবাদের ছবি', 'photo');
      }

      const body = document.createElement('div');
      body.className = 'body';

      addText(body, 'small', news.category || 'অন্যান্য');
      addText(body, 'h3', news.title || 'শিরোনাম নেই');

      const content = news.content || '';
      const preview = content.length > 160
        ? content.slice(0, 160) + '...'
        : content;

      addText(body, 'p', preview);

      if (news.created_at) {
        const date = new Date(news.created_at);
        addText(body, 'small',
          date.toLocaleDateString('bn-BD'));
      }

      const details = document.createElement('details');
      details.style.padding = '0 16px 16px';

      const summary = document.createElement('summary');
      summary.textContent = 'সম্পূর্ণ সংবাদ পড়ুন';
      summary.style.cursor = 'pointer';
      summary.style.color = '#b90024';
      details.appendChild(summary);

      const fullText = document.createElement('p');
      fullText.textContent = content;
      fullText.style.whiteSpace = 'pre-wrap';
      fullText.style.lineHeight = '1.9';
      details.appendChild(fullText);

      card.appendChild(body);
      card.appendChild(details);
      grid.appendChild(card);
    });

    filterNews();

  } catch (error) {
    console.error('News loading error:', error);
    grid.textContent =
      'দুঃখিত! সংবাদ লোড করা যায়নি। ইন্টারনেট সংযোগ বা ডেটাবেজের অনুমতি পরীক্ষা করতে হবে।';
  }
}

loadNews();
    </script>
